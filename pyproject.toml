[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-harness"
version = "0.2.0"
description = "Replaceable Agent Harness execution and Host continuity extension for Ordivon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "ordivon-host @ git+https://github.com/zycxfyh/ordivon-host.git@f1eb6453dc6fe963cdb39c7adbd8588846c60861",
  "ordivon-protocol @ git+https://github.com/zycxfyh/ordivon-computing.git@b86e94c889188ece477e6af44fb3b04caa9bc10f#subdirectory=packages/ordivon-protocol",
]

[project.scripts]
ordivon-harness = "ordivon_harness.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-harness"
Issues = "https://github.com/zycxfyh/ordivon-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
