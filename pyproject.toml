[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-harness"
version = "0.4.0"
description = "Replaceable Agent Harness execution and Host continuity extension for Ordivon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "ordivon-host @ git+https://github.com/zycxfyh/ordivon-host.git@2b17b0683128f995831fef54544f87d0166bab2d",
  "ordivon-protocol @ git+https://github.com/zycxfyh/ordivon-computing.git@37760a58d482c61748ed90ea5f46546cfd2e2344#subdirectory=packages/ordivon-protocol",
]

[project.scripts]
ordivon-harness = "ordivon_harness.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-harness"
Issues = "https://github.com/zycxfyh/ordivon-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
