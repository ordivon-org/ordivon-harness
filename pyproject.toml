[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-harness"
version = "0.5.0"
description = "Host-native Agent Run execution, Provider adaptation, Tool checkpointing, and recovery for Ordivon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "ordivon-host @ git+https://github.com/zycxfyh/ordivon-host.git@1a4027bb26d77a2e051ca933bf664578f071a5a9",
  "ordivon-protocol @ git+https://github.com/zycxfyh/ordivon-computing.git@420dc356cb664d75db0f34f356156baebe5843db#subdirectory=packages/ordivon-protocol",
]

[project.scripts]
ordivon-harness = "ordivon_harness.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-harness"
Issues = "https://github.com/zycxfyh/ordivon-harness/issues"
Documentation = "https://github.com/zycxfyh/ordivon-harness#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
