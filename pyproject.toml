[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-harness"
version = "0.5.0"
description = "Replaceable Agent Harness execution and Host continuity extension for Ordivon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "ordivon-host @ git+https://github.com/zycxfyh/ordivon-host.git@ba5c56411edc4a4d222b66d5372c85fe9dcd261a",
  "ordivon-protocol @ git+https://github.com/zycxfyh/ordivon-computing.git@420dc356cb664d75db0f34f356156baebe5843db#subdirectory=packages/ordivon-protocol",
]

[project.scripts]
ordivon-harness = "ordivon_harness.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-harness"
Issues = "https://github.com/zycxfyh/ordivon-harness/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
