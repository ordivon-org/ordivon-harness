name: Release acceptance

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  portable-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - run: uv lock --check
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: uv run python -m compileall -q src tests scripts evals
      - run: uvx ruff==0.15.17 check src tests scripts
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python scripts/check_dependencies.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_evidence.py
      - run: uv run python scripts/demo_deterministic_run.py
      - run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off
      - run: uv build --wheel --out-dir /tmp/ordivon-harness-wheel
      - run: uv run python scripts/check_wheel.py /tmp/ordivon-harness-wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordivon-harness-wheel-${{ github.sha }}
          path: /tmp/ordivon-harness-wheel/*.whl
          if-no-files-found: error
          retention-days: 30
