name: Harness Runtime acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "53 19 * * 0"

permissions:
  contents: read

jobs:
  host-harness-runtime:
    runs-on: [self-hosted, linux, x64, ordivon-harness-runtime]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - name: Run real Host to Harness to Runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /etc/ordivon/ordivon-runtime.env
          set +a
          test -n "${ORDIVON_BEARER_TOKEN:-}"
          echo "::add-mask::${ORDIVON_BEARER_TOKEN}"
          export ORDIVON_MCP_ENDPOINT="http://127.0.0.1:8897/mcp"
          export ORDIVON_HARNESS_ACCEPTANCE_OUTPUT="target/acceptance/harness-h2-runtime.json"
          uv run scripts/local-acceptance run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-runtime-acceptance-${{ github.sha }}
          path: target/acceptance/harness-h2-runtime.json
          if-no-files-found: error
          retention-days: 30
