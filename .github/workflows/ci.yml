name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run python -m compileall -q src tests scripts evals
      - run: uvx ruff==0.15.17 check src tests scripts
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python scripts/check_dependencies.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_evidence.py
      - run: uv run python scripts/demo_deterministic_run.py
      - run: uv build --wheel --out-dir /tmp/ordivon-harness-wheel
      - run: uv run python scripts/check_wheel.py /tmp/ordivon-harness-wheel

  dependency-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - run: uv run python scripts/check_dependencies.py
      - name: Audit declared third-party PyPI runtime dependencies
        run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
