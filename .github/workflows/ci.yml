name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run python -m compileall -q src tests scripts evals
      - run: uvx ruff==0.15.17 check src tests scripts
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: uv run python scripts/check_dependencies.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_evidence.py
      - run: uv run python scripts/demo_deterministic_run.py
      - run: uv build --wheel --out-dir /tmp/ordivon-harness-wheel
      - run: uv run python scripts/check_wheel.py /tmp/ordivon-harness-wheel

  dependency-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked
      - run: uv run python scripts/check_dependencies.py
      - name: Audit declared third-party PyPI runtime dependencies
        run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
